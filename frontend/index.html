<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>📝 Blog Platform</h1>
    <p>Create, Share & Comment on Blogs</p>
</header>

<div class="container">

    <div class="blog-form">
        <h2>Create New Blog</h2>

        <input type="text" id="title" placeholder="Enter Blog Title">

        <textarea id="content"
        placeholder="Write your blog content here..."></textarea>

        <button onclick="addBlog()">Publish Blog</button>
    </div>

    <h2 class="section-title">Latest Blogs</h2>

    <div id="blogs"></div>

</div>

<script src="script.js"></script>

</body>
</html>
